<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="456" height="456" viewBox="0 0 456 456">
  <!-- A gateway and its peers, with Wi-Fi and Bluetooth as equal local transports.
       All artwork stays within the central adaptive-icon safe circle. -->
  <g fill="none" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <path d="M228 228V130M228 228L130 218M228 228L318 270M228 228V326" stroke="#B38AFF" />
    <path d="M228 228L310 174M228 228L146 282" stroke="#FFB54A" />
  </g>
  <!-- Peer gateways. -->
  <g fill="#161B32" stroke="#B38AFF" stroke-width="9">
    <circle cx="228" cy="130" r="18" />
    <circle cx="130" cy="218" r="18" />
    <circle cx="318" cy="270" r="18" />
    <circle cx="228" cy="326" r="18" />
  </g>
  <g fill="#B38AFF">
    <circle cx="228" cy="130" r="5" />
    <circle cx="130" cy="218" r="5" />
    <circle cx="318" cy="270" r="5" />
    <circle cx="228" cy="326" r="5" />
  </g>
  <!-- Wireless network endpoint. -->
  <circle cx="310" cy="174" r="29" fill="#FFB54A" />
  <g fill="none" stroke="#161B32" stroke-width="5" stroke-linecap="round">
    <path d="M294 169Q310 155 326 169M301 177Q310 169 319 177" />
  </g>
  <circle cx="310" cy="184" r="3.5" fill="#161B32" />
  <!-- Bluetooth endpoint; paths avoid font dependencies. -->
  <circle cx="146" cy="282" r="26" fill="#FFB54A" />
  <path d="M137 273L155 291L146 299V265L155 273L137 291" fill="none" stroke="#161B32" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- The client / gateway at the centre of the graph. -->
  <circle cx="228" cy="228" r="43" fill="#161B32" />
  <circle cx="228" cy="228" r="36" fill="#3779F6" />
  <path d="M214 242V214L242 242V214" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
</svg>
